version: 2
updates:
  # Keeps the actions current, setup-uv included. setup-uv publishes only
  # exact tags (no @v10), so without this it never moves.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  # Refreshes python/uv.lock (the dev tools; the core has no dependencies).
  - package-ecosystem: uv
    directory: /python
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
