[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "artiik"
dynamic = ["version"]
description = "Context management for AI agents: budget, compaction, pins, memory and traces, on top of your provider's native features."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Boualam Hamza" }]
keywords = ["agents", "llm", "context", "compaction", "memory", "claude", "anthropic", "openai"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
# The core must stay dependency-free (tests/test_packaging.py enforces it).
dependencies = []

[project.optional-dependencies]
# Reserved names. Each one gets its requirements when the feature that needs it lands.
anthropic = []
openai = []
embeddings = []
otel = []
tiktoken = []

[project.urls]
Homepage = "https://github.com/Artiik-lab/artiik"
Issues = "https://github.com/Artiik-lab/artiik/issues"
Roadmap = "https://github.com/Artiik-lab/artiik/issues/2"

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.12",
]

[tool.hatch.version]
path = "src/artiik/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/artiik"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
include = ["src", "tests"]
pythonVersion = "3.11"
typeCheckingMode = "strict"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
